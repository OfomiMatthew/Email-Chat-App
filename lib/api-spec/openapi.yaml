openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Email-based direct messaging API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Profiles, contacts, and direct messages
  - name: storage
    description: Private chat attachment uploads and serving.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [chat]
      summary: Get the signed-in user's chat profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUser"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [chat]
      summary: Get compact account activity counts
      responses:
        "200":
          description: Account activity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /contacts:
    get:
      operationId: getContacts
      tags: [chat]
      summary: List the signed-in user's contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
    post:
      operationId: addContact
      tags: [chat]
      summary: Add a contact using their email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUser"
        "400":
          description: Invalid email
        "409":
          description: The user is already a contact
        "404":
          description: No account is registered with that email
  /conversations:
    get:
      operationId: getConversations
      tags: [chat]
      summary: List the signed-in user's conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start or return a conversation with a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "200":
          description: Existing conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: New conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getMessages
      tags: [chat]
      summary: List messages in a conversation
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Conversation not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a chat attachment
      description: Returns a short-lived upload URL for direct upload to private object storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata
        "401":
          description: Authentication required
        "403":
          description: User is not a participant in the conversation
  /storage/attachments/{attachmentId}:
    parameters:
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getChatAttachment
      tags: [storage]
      summary: Serve an attachment to a conversation participant
      responses:
        "200":
          description: Private attachment content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Attachment not found or not accessible
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
      required: [id, email, displayName]
    ContactInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
      required: [email]
    ConversationInput:
      type: object
      properties:
        contactId:
          type: string
          minLength: 1
      required: [contactId]
    MessageInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 4000
          description: Optional message text; send an empty string for attachment-only messages.
        attachments:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required: [content]
    AttachmentInput:
      type: object
      properties:
        objectPath:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
          maxLength: 180
        contentType:
          type: string
          minLength: 1
          maxLength: 120
        size:
          type: integer
          minimum: 1
          maximum: 26214400
      required: [objectPath, fileName, contentType, size]
    Attachment:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        url:
          type: string
          format: uri-reference
      required: [id, fileName, contentType, size, url]
    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required: [id, conversationId, senderId, content, createdAt, attachments]
    Conversation:
      type: object
      properties:
        id:
          type: integer
        contact:
          $ref: "#/components/schemas/ChatUser"
        lastMessage:
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        updatedAt:
          type: string
          format: date-time
      required: [id, contact, lastMessage, updatedAt]
    DashboardSummary:
      type: object
      properties:
        contactCount:
          type: integer
        conversationCount:
          type: integer
        messageCount:
          type: integer
      required: [contactCount, conversationCount, messageCount]
    UploadUrlRequest:
      type: object
      properties:
        conversationId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 180
        size:
          type: integer
          minimum: 1
          maximum: 26214400
        contentType:
          type: string
          minLength: 1
          maxLength: 120
      required: [conversationId, name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
      required: [uploadURL, objectPath]
